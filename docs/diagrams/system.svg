<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 340" role="img"><title>The chip and its package</title><desc>A serial memory die holding the program sits in the package beside the RV328 die and is read through a cache; the die holds the processor, RAM, peripherals, clock unit and the analog macro.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#0b0b0b}.ts{font-size:12px;fill:#52514e}
.box{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:.5}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
@media (prefers-color-scheme: dark){
.th{fill:#f0efec}.ts{fill:#c3c2b7}.box{fill:#151515;stroke:#383835}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.arr{stroke:#9c9a92}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="20" y="20" width="640" height="300" rx="8" stroke-dasharray="4 3"/>
<text class="ts" x="40" y="40" text-anchor="start" dominant-baseline="central">32-pin package</text>
<g class="gray"><rect x="44" y="120" width="130" height="80" rx="4"/><text class="th" x="109" y="150" text-anchor="middle" dominant-baseline="central">Serial memory</text><text class="ts" x="109" y="170" text-anchor="middle" dominant-baseline="central">program, 32 KB</text></g>
<rect class="box" x="230" y="60" width="406" height="236" rx="6"/>
<text class="ts" x="246" y="78" text-anchor="start" dominant-baseline="central">RV328 die</text>
<g class="gray"><rect x="250" y="120" width="110" height="80" rx="4"/><text class="th" x="305" y="150" text-anchor="middle" dominant-baseline="central">Cache</text><text class="ts" x="305" y="170" text-anchor="middle" dominant-baseline="central">12 KB, three-way</text></g>
<g class="purple"><rect x="392" y="96" width="110" height="56" rx="4"/><text class="th" x="447" y="114" text-anchor="middle" dominant-baseline="central">Processor</text><text class="ts" x="447" y="134" text-anchor="middle" dominant-baseline="central">RV32IMC</text></g>
<g class="gray"><rect x="392" y="168" width="110" height="56" rx="4"/><text class="th" x="447" y="186" text-anchor="middle" dominant-baseline="central">RAM</text><text class="ts" x="447" y="206" text-anchor="middle" dominant-baseline="central">2 KB</text></g>
<g class="purple"><rect x="534" y="96" width="86" height="128" rx="4"/><text class="th" x="577" y="150" text-anchor="middle" dominant-baseline="central">Peripherals</text><text class="ts" x="577" y="170" text-anchor="middle" dominant-baseline="central">16 slots</text></g>
<g class="teal"><rect x="392" y="236" width="228" height="50" rx="4"/><text class="th" x="506" y="251" text-anchor="middle" dominant-baseline="central">Analog macro</text><text class="ts" x="506" y="271" text-anchor="middle" dominant-baseline="central">converter, oscillators, reset</text></g>
<g class="purple"><rect x="250" y="236" width="110" height="50" rx="4"/><text class="th" x="305" y="251" text-anchor="middle" dominant-baseline="central">Clock unit</text><text class="ts" x="305" y="271" text-anchor="middle" dominant-baseline="central">reset, sleep</text></g>
<line class="arr" x1="176" y1="160" x2="246" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="211" y="146" text-anchor="middle" dominant-baseline="central">SPI</text>
<line class="arr" x1="362" y1="134" x2="388" y2="134" marker-end="url(#arrow)"/>
<line class="arr" x1="504" y1="124" x2="530" y2="124" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="447" y1="154" x2="447" y2="166" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
