<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 380" role="img"><title>Three ways to arrange the full-height chip</title><desc>Today: memory blocks at top and bottom with logic between. Logic ring: memory in the centre, logic next to the pads. Finished blocks: separately completed blocks tiled together.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#0b0b0b}.ts{font-size:12px;fill:#52514e}
.box{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:.5}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
@media (prefers-color-scheme: dark){
.th{fill:#f0efec}.ts{fill:#c3c2b7}.box{fill:#151515;stroke:#383835}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.arr{stroke:#9c9a92}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="130" y="40" text-anchor="middle" dominant-baseline="central">Today</text>
<rect class="box" x="40" y="60" width="180" height="240" rx="4"/>
<text class="ts" x="130" y="322" text-anchor="middle" dominant-baseline="central">Pads behind memory</text>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Logic ring</text>
<rect class="box" x="250" y="60" width="180" height="240" rx="4"/>
<text class="ts" x="340" y="322" text-anchor="middle" dominant-baseline="central">Pads next to logic</text>
<text class="th" x="550" y="40" text-anchor="middle" dominant-baseline="central">Finished blocks</text>
<rect class="box" x="460" y="60" width="180" height="240" rx="4"/>
<text class="ts" x="550" y="322" text-anchor="middle" dominant-baseline="central">Each block closed alone</text>
<g class="gray"><rect x="48" y="68" width="138" height="64" rx="4"/><text class="ts" x="117" y="100" text-anchor="middle" dominant-baseline="central">Memory</text></g>
<g class="purple"><rect x="48" y="138" width="92" height="74" rx="4"/><text class="ts" x="94" y="175" text-anchor="middle" dominant-baseline="central">Logic</text></g>
<g class="teal"><rect x="146" y="146" width="66" height="58" rx="4"/><text class="ts" x="179" y="175" text-anchor="middle" dominant-baseline="central">Analog</text></g>
<g class="gray"><rect x="48" y="218" width="138" height="74" rx="4"/><text class="ts" x="117" y="255" text-anchor="middle" dominant-baseline="central">Memory</text></g>
<g class="purple"><rect x="192" y="68" width="20" height="72" rx="4"/><text class="ts" x="202" y="104" text-anchor="middle" dominant-baseline="central"></text></g>
<g class="purple"><rect x="192" y="210" width="20" height="82" rx="4"/><text class="ts" x="202" y="251" text-anchor="middle" dominant-baseline="central"></text></g>
<g class="purple"><rect x="258" y="68" width="164" height="224" rx="4"/><text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">Logic</text></g>
<g class="gray"><rect x="276" y="92" width="92" height="182" rx="4"/><text class="ts" x="322" y="183" text-anchor="middle" dominant-baseline="central">Memory</text></g>
<g class="teal"><rect x="374" y="124" width="42" height="118" rx="4"/><text class="ts" x="395" y="183" text-anchor="middle" dominant-baseline="central">Ana.</text></g>
<g class="gray"><rect x="468" y="68" width="164" height="110" rx="4"/><text class="ts" x="550" y="123" text-anchor="middle" dominant-baseline="central">Cache block</text></g>
<g class="gray"><rect x="468" y="184" width="60" height="50" rx="4"/><text class="ts" x="498" y="209" text-anchor="middle" dominant-baseline="central">RAM</text></g>
<g class="purple"><rect x="534" y="184" width="98" height="50" rx="4"/><text class="ts" x="583" y="209" text-anchor="middle" dominant-baseline="central">Processor</text></g>
<g class="purple"><rect x="468" y="240" width="98" height="52" rx="4"/><text class="ts" x="517" y="266" text-anchor="middle" dominant-baseline="central">Peripherals</text></g>
<g class="teal"><rect x="572" y="240" width="60" height="52" rx="4"/><text class="ts" x="602" y="266" text-anchor="middle" dominant-baseline="central">Analog</text></g>
<g class="gray"><rect x="190" y="346" width="12" height="12" rx="2"/></g>
<text class="ts" x="208" y="352" text-anchor="start" dominant-baseline="central">Memory</text>
<g class="purple"><rect x="290" y="346" width="12" height="12" rx="2"/></g>
<text class="ts" x="308" y="352" text-anchor="start" dominant-baseline="central">Logic</text>
<g class="teal"><rect x="380" y="346" width="12" height="12" rx="2"/></g>
<text class="ts" x="398" y="352" text-anchor="start" dominant-baseline="central">Analog macro</text>
</svg>
