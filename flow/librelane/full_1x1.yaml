# Full-height slot with the 12 KB three-way cache and the fast multiplier; a blank block of 1405 x 927 um at
# (2085, 2355) stands where the analog macro goes (scripts/gen_floorplan_1x1.py). Pass this file last.
IGNORE_DISCONNECTED_MODULES: [gf180mcu_fd_io__bi_24t, gf180mcu_fd_io__in_c, gf180mcu_fd_io__asig_5p0, gf180mcu_ws_ip__qrcode_id, gf180mcu_ws_ip__shuttle_id, gf180mcu_ws_ip__project_id, gf180mcu_ws_ip__marker,
  rv328_analog_blank]
PDN_CFG: dir::pdn/pdn_cfg_1x1.tcl
VERILOG_DEFINES: [SLOT_1X1, RV328_TECH_GF180, RV328_ANALOG_STUB, RV328_WAFERSPACE_IDS, RV328_SC9T, RV328_ANALOG_BLANK, RV328_CACHE_KB=4, RV328_CACHE_WAYS=3, RV328_CACHE_PIN=2, RV328_MUL_FAST=1]
PL_TARGET_DENSITY_PCT: 45
# pads behind a row of memories: let the legaliser carry their buffers to the nearest rows
PL_MAX_DISPLACEMENT_X: 3000
PL_MAX_DISPLACEMENT_Y: 1600
# no double spacing for the upper clock nets: where global routing finds congestion it takes that rule
# off one net at a time and may not finish (docs/layout_results.md, trial with the analog block)
CTS_APPLY_NDR: none
# Timing repair works on the nominal wire model; the slowest corner with the worst-case wire model was
# 2.0 ns slower on the multiplier in the first run (-1.57 ns), so ask for that much more margin
PL_RESIZER_SETUP_SLACK_MARGIN: 4.0
GRT_RESIZER_SETUP_SLACK_MARGIN: 3.5
